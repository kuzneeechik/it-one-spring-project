server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: spring-project

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Notes}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:363639}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update